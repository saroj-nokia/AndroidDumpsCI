name: Dump

# 1. Enable manual workflow trigger and define a ROM_URL input
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      rom_url:
        description: 'Firmware Download URL (e.g., OTA, Fastboot ZIP)'
        required: true
        default: 'https://cdnorg.d.miui.com/OS2.0.206.0.VNGMIXM/sapphire_global-ota_full-OS2.0.206.0.VNGMIXM-user-15.0-66bfbbb217.zip'

jobs:
  build:
    runs-on: ubuntu-22.04
    
    # Define the input URL as an environment variable
    env:
      INPUT_ROM_URL: ${{ github.event.inputs.rom_url }}

    steps:
      - name: Checkouts
        uses: actions/checkout@v4

      - name: Setup Dump Environment
        run: |
          # 1. Install core dependencies, compilation tools, and zstd
          sudo apt update -y && sudo apt upgrade -y
          sudo apt install unace python3 unrar zip unzip p7zip-full p7zip-rar sharutils rar uudeview mpack arj cabextract device-tree-compiler liblzma-dev python3-pip python3-setuptools brotli liblz4-tool axel gawk aria2 detox cpio rename build-essential curl zstd -y
          
          # 2. FIX: Install Rust/Cargo for ripgrep compilation
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          
          # 3. Compile and install ripgrep with PCRE2 feature enabled
          # This resolves the 'PCRE2 is not available' error.
          cargo install ripgrep --features pcre2
          
          # 4. Install Python dependencies
          pip3 install pip -U
          pip3 install setuptools==69.5.1 wheel -U
          pip3 install backports.lzma protobuf pycrypto docopt zstandard twrpdtgen

      - name: Running Dumpyara Shell Script
        run: |
          # Define the default URL (used if INPUT_ROM_URL is empty, i.e., on a push trigger)
          DEFAULT_URL='https://cdnorg.d.miui.com/OS2.0.206.0.VNGMIXM/sapphire_global-ota_full-OS2.0.206.0.VNGMIXM-user-15.0-66bfbbb217.zip'

          # FIX: Use Bash parameter expansion to ensure a valid URL is always passed.
          # If $INPUT_ROM_URL is set (manual trigger), use it; otherwise, use $DEFAULT_URL.
          URL_TO_USE="${INPUT_ROM_URL:-$DEFAULT_URL}"

          echo "Using URL: $URL_TO_USE"
          
          bash .github/workflows/setup.sh
          bash .github/workflows/dumpyara.sh "$URL_TO_USE"

      - name: Checking Folder
        run: |
          cd /home/runner/work/AndroidDumpsCI/AndroidDumpsCI/.github/workflows/working/
          ls -la

      - name: Compressing with tar.zst (Faster)
        run: |
          cd /home/runner/work/AndroidDumpsCI/AndroidDumpsCI/.github/workflows/working/
          # Uses zstd -T0 (all threads) at level 3 for fast, efficient compresssion.
          tar c /home/runner/work/AndroidDumpsCI/AndroidDumpsCI/.github/workflows/working/* | zstd -T0 -3 > dump.tar.zst

      - name: Store Generated Files as Artifact
        uses: actions/upload-artifact@v4
        with:
          path: /home/runner/work/AndroidDumpsCI/AndroidDumpsCI/.github/workflows/working/dump.tar.zst
          if-no-files-found: error
          name: ${{ github.run_id }}_dump_files
